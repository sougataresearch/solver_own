name: CI (fast suite)

# Category 17 target 17.2 (COMMERCIAL_RCWA_ATOMIC_TARGETS.md): run the
# fast (non-`slow`) suite on every push/PR touching this project, on
# windows-latest per this target's own wording -- this project has been
# developed and tested exclusively on Windows so far, and the fast suite
# is the one every commit is expected to keep green (testing.md's
# Regression Testing section: "run the full (non-`slow`) suite before
# every commit that touches src/sougata_solver/"). Slow-marked
# convergence/benchmark studies run in a separate workflow
# (slow-tests.yml, target 17.3) since they take minutes, not seconds, and
# shouldn't gate every push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  fast-suite:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint (target 17.5)
        run: ruff check .

      - name: Fast test suite (excludes slow)
        run: pytest -m "not slow" -q

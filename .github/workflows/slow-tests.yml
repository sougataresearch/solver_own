name: Slow tests (convergence/benchmark studies)

# Category 17 target 17.3 (COMMERCIAL_RCWA_ATOMIC_TARGETS.md): `slow`-
# marked tests (convergence/benchmark studies, several minutes total --
# tests/test_harmonic_convergence_matrix.py's 4 slow cases alone took
# ~447s in this session) don't gate every push (ci.yml, target 17.2,
# excludes them via `-m "not slow"`). Instead they run on a weekly
# schedule (catches slow drift/regressions without slowing down normal
# development) and are always available on demand via
# `workflow_dispatch` (e.g. right before a release, or after touching
# anything convergence-related) -- both triggers explicitly requested by
# this target's own wording ("schedule or manually trigger").

on:
  schedule:
    - cron: "0 6 * * 1"  # every Monday 06:00 UTC
  workflow_dispatch:

jobs:
  slow-suite:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Slow test suite
        run: pytest -m slow -q

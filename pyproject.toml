[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sougata_solver"
version = "0.1.0"
description = "Pure-Python Rigorous Coupled-Wave Analysis (RCWA) solver for periodic layered electromagnetic structures"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "matplotlib>=3.7"]

[project.scripts]
sougata-solver = "sougata_solver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: convergence/benchmark studies excluded from the default run",
]
